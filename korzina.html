<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина — Infokomvostok</title>
    <style>
        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            font-family: Arial, sans-serif;
        }
        .window {
            width: 650px;
            max-height: 90vh;
            border: 5px solid blue;
            background-color: white;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; margin-top: 0; margin-bottom: 5px; }
        #userWelcome { text-align: center; color: #007bff; margin-bottom: 15px; font-size: 16px; padding: 5px; background: #f0f7ff; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f0f0f0; }
        .total { font-weight: bold; text-align: right; }
        
        .price-cell { 
            white-space: nowrap; 
            text-align: right; 
            min-width: 100px; 
            font-family: 'Courier New', monospace;
        }

        /* Контейнер для кнопок управления количеством */
        .qty-container { display: flex; align-items: center; justify-content: center; gap: 2px; }
        .qty-btn { width: 28px; height: 30px; cursor: pointer; font-weight: bold; border: 1px solid #ccc; background: #eee; border-radius: 4px; }
        .qty-btn:hover { background: #ddd; }
        
        /* Поле ввода: тип text убирает лишние стрелки браузера */
        .qty-input { 
            width: 30px; /* Сделано под 2 цифры */
            height: 28px; 
            text-align: center; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            font-size: 14px;
        }

        .buttons-container { display: flex; flex-direction: column; gap: 10px; background: #f9f9f9; padding: 15px; border-radius: 5px; }
        .main-row { display: flex; justify-content: space-between; gap: 10px; }
        
        button.action-btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; }
        .btn-pay { background-color: #28a745; }
        .btn-clear { background-color: #6c757d; }
        .btn-close { background-color: #dc3545; }
        .btn-confirm { background-color: #007bff; width: 100%; margin-top: 10px; }

        #commentSection { border: 1px solid #007bff; padding: 15px; margin-top: 10px; display: none; }
        textarea, select { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>

<div class="window">
    <h1>Корзина</h1>
    <div id="userWelcome">Заказчик: <span id="clientName">Гость</span></div>
    
    <table id="cartTable">
        <thead>
            <tr>
                <th>Наименование</th>
                <th style="text-align: center; width: 100px;">Кол-во</th>
                <th>Цена</th>
                <th>Сумма</th>
            </tr>
        </thead>
        <tbody></tbody>
        <tfoot>
            <tr>
                <td colspan="3" class="total">ИТОГО:</td>
                <td id="totalSum" class="price-cell" style="font-weight: bold; font-size: 1.1em;">0</td>
            </tr>
        </tfoot>
    </table>

    <div class="buttons-container">
        <div id="mainButtons" class="main-row">
            <button class="action-btn btn-pay" onclick="showCommentField()">Оформить заказ</button>
            <button class="action-btn btn-clear" onclick="clearCart()">Очистить</button>
            <button class="action-btn btn-close" onclick="window.close()">Закрыть</button>
        </div>

        <div id="commentSection">
            <label><b>Куда доставить или где забрать?</b></label>
            <select id="deliveryPoint">
                <option value="ТК Маяк">ТК "Маяк"</option>
                <option value="В центре г.Донецка">В центре г.Донецка</option>
                <option value="Другое">Другое (укажу ниже)</option>
            </select>
            <label><b>Контакты (Телефон/Telegram):</b></label>
            <textarea id="clientComment" rows="3" placeholder="Укажите как с вами связаться..."></textarea>
            <button id="confirmPaymentButton" class="action-btn btn-confirm" onclick="proceedToPayment()">ОТПРАВИТЬ ЗАКАЗ</button>
        </div>
    </div>
</div>

<script>
    let array4 = [];

    function loadCart() {
        const savedName = localStorage.getItem('username');
        document.getElementById("clientName").textContent = savedName || "Гость";

        const stored = localStorage.getItem('array4');
        array4 = stored ? JSON.parse(stored) : [];
        
        let n2n = localStorage.getItem('n2n');
        if (n2n && n2n !== 'null') {
            let parts = n2n.split('|');
            for (let i = 0; i < parts.length; i += 2) {
                if (parts[i] && parts[i+1]) {
                    let newName = parts[i].trim();
                    let newPriceStr = parts[i+1].trim();
                    let found = false;
                    for (let j = 0; j < array4.length; j += 3) {
                        if (array4[j] === newName) {
                            array4[j+1] = String(parseInt(array4[j+1]) + 1);
                            found = true; break;
                        }
                    }
                    if (!found) { array4.push(newName, "1", newPriceStr); }
                }
            }
            localStorage.removeItem('n2n');
            saveCart();
        }
        renderCart();
    }

    function saveCart() { localStorage.setItem('array4', JSON.stringify(array4)); }

    function renderCart() {
        const tbody = document.querySelector("#cartTable tbody");
        const totalElem = document.getElementById("totalSum");
        tbody.innerHTML = '';
        let total = 0;
        let detectedCurrency = "";

        for (let i = 0; i < array4.length; i += 3) {
            const name = array4[i];
            const qty = Number(array4[i+1]);
            const priceStr = array4[i+2];
            
            const cleanPrice = parseFloat(priceStr.replace(/[^0-9.,]/g, "").replace(',', '.')) || 0;
            
            if (!detectedCurrency) {
                detectedCurrency = priceStr.replace(/[0-9., ]/g, "");
            }

            const sum = qty * cleanPrice;
            total += sum;

            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${name}</td>
                <td style="text-align: center;">
                    <div class="qty-container">
                        <button class="qty-btn" onclick="changeQty(${i}, -1)">-</button>
                        <input type="text" class="qty-input" value="${qty}" onchange="manualUpdateQty(${i}, this.value)">
                        <button class="qty-btn" onclick="changeQty(${i}, 1)">+</button>
                    </div>
                </td>
                <td class="price-cell">${cleanPrice.toFixed(2)}&nbsp;${detectedCurrency}</td>
                <td class="price-cell">${sum.toFixed(2)}&nbsp;${detectedCurrency}</td>
            `;
            tbody.appendChild(row);
        }
        totalElem.innerHTML = total.toFixed(2) + "&nbsp;" + (detectedCurrency || "");
    }

    function changeQty(index, delta) {
        let currentQty = parseInt(array4[index + 1]);
        let newQty = currentQty + delta;
        if (newQty <= 0) { 
            if(confirm("Удалить этот товар из списка?")) {
                array4.splice(index, 3); 
            }
        } else { 
            array4[index + 1] = String(newQty); 
        }
        saveCart(); renderCart();
    }

    function manualUpdateQty(index, val) {
        let newQty = parseInt(val);
        // Проверка: если ввели не число или 0
        if (isNaN(newQty) || newQty <= 0) {
            if(confirm("Удалить этот товар из списка?")) {
                array4.splice(index, 3);
            } else {
                renderCart(); // Отмена удаления, перерисовка старого значения
            }
        } else {
            array4[index + 1] = String(newQty);
        }
        saveCart(); renderCart();
    }

    function clearCart() { if(confirm("Полностью очистить корзину?")) { array4 = []; saveCart(); renderCart(); } }

    function showCommentField() { if (array4.length > 0) document.getElementById("commentSection").style.display = "block"; }

    async function proceedToPayment() {
        const btn = document.getElementById('confirmPaymentButton');
        const comment = document.getElementById('clientComment').value;
        if (comment.length < 5) return alert("Пожалуйста, укажите контакты для связи.");

        btn.disabled = true; btn.innerText = "Отправка заказа...";
        let orderDetails = "";
        for (let i = 0; i < array4.length; i += 3) {
            let cleanName = array4[i].replace(/<[^>]*>?/gm, '');
            orderDetails += `${cleanName} x ${array4[i+1]} (${array4[i+2]})\n`;
        }

        try {
            const res = await fetch("https://formspree.io/f/xnjzerwn", {
                method: "POST",
                body: JSON.stringify({ 
                    Заказчик: document.getElementById("clientName").textContent,
                    Заказ: orderDetails, 
                    Контакты: comment, 
                    Место: document.getElementById("deliveryPoint").value,
                    Итого: document.getElementById('totalSum').innerText 
                }),
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }
            });
            if (res.ok) { 
                alert("Заказ успешно отправлен! Мы свяжемся с вами."); 
                array4 = []; saveCart(); window.close(); 
            }
        } catch (e) { 
            alert("Произошла ошибка при отправке."); 
            btn.disabled = false; btn.innerText = "ОТПРАВИТЬ ЗАКАЗ";
        }
    }

    document.addEventListener("DOMContentLoaded", loadCart);
</script>
</body>
</html>
