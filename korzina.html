<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина — Infokom.vip</title>
    <style>
        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            font-family: Arial, sans-serif;
        }
        .window {
            width: 650px;
            max-height: 90vh;
            border: 5px solid blue;
            background-color: white;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        h1 { text-align: center; margin-top: 0; margin-bottom: 5px; }
        #userWelcome { 
            text-align: center; 
            color: #007bff; 
            margin-bottom: 15px; 
            font-size: 16px;
            padding: 5px;
            background: #f0f7ff;
            border-radius: 4px;
        }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f0f0f0; }
        .total { font-weight: bold; text-align: right; }
        
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
        }
        .main-row { display: flex; justify-content: space-between; gap: 10px; }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }
        .btn-pay { background-color: #28a745; }
        .btn-clear { background-color: #6c757d; }
        .btn-close { background-color: #dc3545; }
        .btn-confirm { background-color: #007bff; width: 100%; margin-top: 10px; }

        #commentSection {
            border: 1px solid #007bff;
            padding: 15px;
            margin-top: 10px;
            display: none;
        }
        .contact-info {
            background: #e9ecef;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 14px;
            line-height: 1.5;
        }
        textarea { width: 100%; border: 1px solid #ccc; padding: 5px; resize: none; box-sizing: border-box; margin-top: 5px; }

        .error-field {
            border: 2px solid red !important;
            background-color: #fff0f0;
        }
    </style>
</head>
<body>

<div class="window">
    <h1>Корзина</h1>
    <div id="userWelcome">Заказчик: <span id="clientName">Гость</span></div>
    
    <table id="cartTable">
        <thead>
            <tr>
                <th>Наименование</th>
                <th>Кол-во</th>
                <th>Цена</th>
                <th>Сумма</th>
            </tr>
        </thead>
        <tbody></tbody>
        <tfoot>
            <tr>
                <td colspan="3" class="total">ИТОГО:</td>
                <td id="totalSum" style="font-weight: bold;">0</td>
            </tr>
        </tfoot>
    </table>

    <div class="buttons-container">
        <div id="mainButtons" class="main-row">
            <button class="btn-pay" onclick="showCommentField()">Оформить заказ</button>
            <button class="btn-clear" onclick="clearCart()">Очистить</button>
            <button class="btn-close" onclick="window.close()">Закрыть</button>
        </div>
		
<div id="commentSection">
    <div class="contact-info">
        <strong>Наши контакты для связи:</strong><br>
        📞 Телефон: <a href="tel:+79491234567" style="color: #007bff; text-decoration: none;">+7 (949) 123-45-67</a><br>
        ✈️ Telegram: <a href="https://t.me/ваш_ник" target="_blank" style="color: #007bff; text-decoration: none;">@ваш_ник</a><br>
        💰 <strong>Оплата при получении заказа</strong>
    </div>

    <label><b>Где вам удобно получить заказ?</b></label>
    <select id="deliveryPoint" style="width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #ccc; border-radius: 5px;">
        <option value="ТК Маяк">ТК "Маяк"</option>
        <option value="В центре г.Донецка">В центре г.Донецка</option>
        <option value="Другое">Другое (укажу в комментарии)</option>
    </select>

    <label><b>Ваши контакты и комментарий:</b></label>
    <textarea id="clientComment" rows="3" placeholder="Ваш телефон или ник в Telegram..."></textarea>
    
    <button id="confirmPaymentButton" class="btn-confirm" onclick="proceedToPayment()">ОТПРАВИТЬ ЗАКАЗ</button>
    <button type="button" onclick="cancelPayment()" style="background:none; color: gray; width:100%; margin-top:5px; font-size:12px; border:none; cursor:pointer;">Отмена</button>
</div>

            <div class="contact-info">
                <strong>Наши контакты для связи:</strong><br>

        </div> -->
    </div>
</div>

<script>
    let array4 = [];

    // Данные продавца (измените на свои)
    const MY_PHONE = "+7 (949) 540-55-20";
    const MY_TELEGRAM = "@alex2858r";

    function loadCart() {
        const savedName = localStorage.getItem('username');
        document.getElementById("clientName").textContent = (savedName && savedName !== "name") ? savedName : "Гость";

        const stored = localStorage.getItem('array4');
        array4 = stored ? JSON.parse(stored) : [];
        
        let n2n = localStorage.getItem('n2n');
        if (n2n && n2n !== 'null') {
            let parts = n2n.split('|');
            for (let i = 0; i < parts.length; i += 2) {
                if (parts[i] && parts[i+1]) {
                    let newName = parts[i].trim();
                    let newPrice = parts[i+1].trim();
                    let found = false;
                    for (let j = 0; j < array4.length; j += 3) {
                        if (array4[j] === newName) {
                            array4[j+1] = String(parseInt(array4[j+1]) + 1);
                            found = true;
                            break;
                        }
                    }
                    if (!found) { array4.push(newName, "1", newPrice); }
                }
            }
            localStorage.removeItem('n2n');
            saveCart();
        }
        renderCart();
    }

    function saveCart() {
        localStorage.setItem('array4', JSON.stringify(array4));
    }

    function clearCart() {
        if(confirm("Очистить корзину?")) {
            array4 = [];
            saveCart();
            renderCart();
        }
    }

    function renderCart() {
        const tbody = document.querySelector("#cartTable tbody");
        const totalElem = document.getElementById("totalSum");
        tbody.innerHTML = '';
        let total = 0;

        for (let i = 0; i < array4.length; i += 3) {
            const name = array4[i], qty = Number(array4[i+1]), price = Number(array4[i+2]);
            const sum = qty * price;
            total += sum;

            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${name}</td>
                <td><input type="number" value="${qty}" min="0" style="width:60px" onchange="updateQty(${i}, this.value)"></td>
                <td>${price}</td>
                <td>${sum}</td>
            `;
            tbody.appendChild(row);
        }
        totalElem.textContent = total;
    }

    function updateQty(index, val) {
        let newQty = parseInt(val);
        if (isNaN(newQty) || newQty <= 0) { array4.splice(index, 3); } 
        else { array4[index + 1] = String(newQty); }
        saveCart();
        renderCart();
    }

    function showCommentField() {
        if (array4.length === 0) return alert("Корзина пуста!");
        document.getElementById("commentSection").style.display = "block";
        document.getElementById("commentSection").scrollIntoView({ behavior: 'smooth' });
    }

    function cancelPayment() {
        document.getElementById("commentSection").style.display = "none";
    }

async function proceedToPayment() {
    const btn = document.getElementById('confirmPaymentButton');
    const commentField = document.getElementById('clientComment');
    const deliveryField = document.getElementById('deliveryPoint'); // Новый элемент
    const user = localStorage.getItem('username') || "Не указано";
    const total = document.getElementById('totalSum').textContent;

    if (commentField.value.trim().length < 5) {
        alert("Пожалуйста, укажите ваши контакты.");
        commentField.classList.add('error-field');
        commentField.focus();
        return;
    }

    commentField.classList.remove('error-field');
    btn.disabled = true;
    btn.innerText = "Отправка...";

    let orderList = "";
    for (let i = 0; i < array4.length; i += 3) {
        orderList += `${array4[i]} x ${array4[i+1]} шт. (${array4[i+2]} руб.)\n`;
    }

    try {
        const response = await fetch("https://formspree.io/f/xnjzerwn", {
            method: "POST",
            body: JSON.stringify({
                Заказчик: user,
                Место_получения: deliveryField.value, // Передаем пункт выдачи
                Контакты_клиента: commentField.value,
                ЗАКАЗ: orderList,
                ИТОГО: total + " руб.",
                Оплата: "При получении"
            }),
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }
        });

        if (response.ok) {
            // Текст чека для скачивания
            const receiptText = `ВАШ ЗАКАЗ в Infokomvostok\n` +
                `==========================\n` +
                `Заказчик: ${user}\n` +
                `Дата: ${new Date().toLocaleString()}\n` +
                `==========================\n` +
                `ТОВАРЫ:\n${orderList}` +
                `==========================\n` +
                `ИТОГО: ${total} руб.\n` +
                `ОПЛАТА: При получении\n` +
                `МЕСТО ВЫДАЧИ: ${deliveryField.value}\n` +
                `==========================\n` +
                `ВАШИ ДАННЫЕ: ${commentField.value}\n\n` +
                `СВЯЗЬ С НАМИ:\n` +
                `Тел: ${MY_PHONE}\n` +
                `TG: ${MY_TELEGRAM}\n\n` +
                `Спасибо за покупку! Сохраните этот чек.`;

            const blob = new Blob([receiptText], { type: "text/plain" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Check_Infokom_${Date.now()}.txt`;
            link.click();

            alert("Заказ отправлен! Мы свяжемся с вами для подтверждения.");
            array4 = []; 
            saveCart();
            window.close();
        } else { throw new Error(); }
    } catch (error) {
        alert("Ошибка отправки. Попробуйте снова.");
        btn.disabled = false;
        btn.innerText = "ОТПРАВИТЬ ЗАКАЗ";
    }
}
    document.addEventListener("DOMContentLoaded", loadCart);
</script>
</body>
</html>
