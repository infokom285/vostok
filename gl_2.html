<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр товара</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .text-style {
            font-size: 16px;
            margin: 8px 0;
            color: #333;
        }
        .button-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .button-style { background-color: #28a745; color: white; }
        .button-close { background-color: #dc3545; color: white; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

<div class="container" id="output"></div>

<script>
    window.onload = function() {
        const data = localStorage.getItem('containerContent');

        if (data) {
            const content = JSON.parse(data);

            document.getElementById('output').innerHTML = `
                <img src="${content.imgSrc || 'img/no-image.png'}" alt="Товар">
                <p class="text-style"><strong>Название:</strong> ${content.text || "Без названия"}</p>
                <p class="text-style"><strong>Цена:</strong> ${content.text1 || "0"} руб.</p>
                
                <div class="button-group">
                    <button class="button-style" onclick="saveToCart()">Добавить в корзину</button>
                    <button class="button-close" onclick="window.close()">Закрыть</button>
                </div>
            `;
        } else {
            document.getElementById('output').innerHTML = "<p style='color:red;'>Товар не найден!</p>";
        }
    };

    function saveToCart() {
        const data = localStorage.getItem('containerContent');
        if (!data) return;

        const content = JSON.parse(data);
        
        // Формируем строку текущего товара
        const name = content.text ? content.text.trim() : "Без названия";
        const price = content.text1 ? content.text1.trim() : "0";
        const newEntry = name + "|" + price;

        // Читаем, что уже лежит в очереди n2n
        let existingN2N = localStorage.getItem('n2n');

        // Если n2n не пустой и не "null", добавляем новый товар через разделитель
        if (existingN2N && existingN2N !== "null") {
            localStorage.setItem('n2n', existingN2N + "|" + newEntry);
        } else {
            // Если n2n пустой, просто записываем текущий товар
            localStorage.setItem('n2n', newEntry);
        }
        
        alert('Товар добавлен в корзину!');
        window.close(); 
    }
</script>

</body>
</html>
