<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Написать нам</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 800px; /* Увеличено для размещения кнопок в ряд */
            text-align: center;
        }

        h2 { font-size: 22px; font-weight: bold; margin-bottom: 20px; }

        /* Стили полей ввода */
        input[type="text"], select, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #000;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        textarea { height: 100px; resize: none; }

        /* Контейнер для кнопок в одну строку */
        .buttons-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        /* Общие стили кнопок */
        .btn {
            padding: 10px 15px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            border: 1px solid #767676;
            text-decoration: none;
            color: black;
            background-color: #f0f0f0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        .btn-wa { background-color: #25D366; color: white; border: none; }
        .btn-tg { background-color: #0088cc; color: white; border: none; }
        
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Написать нам</h2>

        <form id="commentForm">
            <input type="text" name="name" id="userName" placeholder="Ваше имя" required>
            <input type="text" name="contact" placeholder="Ваш телефон, WhatsApp или Telegram" required>
            
            <select name="subject" required>
                <option value="" disabled selected>Выберите тему обращения</option>
                <option value="Заказ">📦 Сделать заказ</option>
                <option value="Вопрос">❓ Вопрос</option>
                <option value="Ошибка">⚠️ Ошибка</option>
            </select>
            
            <textarea name="message" id="commentText" placeholder="Введите ваше сообщение..." required></textarea>

            <div class="buttons-row">
                <a href="https://wa.me/79495405520" target="_blank" class="btn btn-wa">WhatsApp</a>
                <a href="https://t.me/alex2858r" target="_blank" class="btn btn-tg">Telegram</a>
                
                <button type="submit" id="submitBtn" class="btn">Email</button>
                <button type="button" onclick="window.close()" class="btn">Выход</button>
            </div>
        </form>
    </div>

    <script>
        // Автозаполнение имени из localStorage
        document.addEventListener("DOMContentLoaded", () => {
            const savedName = localStorage.getItem('username');
            if (savedName) document.getElementById('userName').value = savedName;
        });

        const form = document.getElementById('commentForm');
        const submitBtn = document.getElementById('submitBtn');

        form.onsubmit = async function(e) {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerText = "Отправка...";

            const formData = new FormData(form);

            try {
                const response = await fetch("https://formspree.io/f/xnjzerwn", {
                    method: "POST",
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    alert("Сообщение отправлено!");
                    window.close();
                } else {
                    alert("Ошибка отправки.");
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Email";
                }
            } catch (error) {
                alert("Ошибка сети.");
                submitBtn.disabled = false;
            }
        };
    </script>
</body>
</html>
