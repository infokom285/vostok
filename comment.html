<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Связаться с нами</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h2 { font-size: 22px; font-weight: bold; margin-bottom: 20px; }

        /* Общие стили для всех полей ввода */
        input[type="text"], select, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #000;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            background-color: #fff;
        }

        textarea { height: 100px; resize: none; }

        .buttons {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 15px;
            cursor: pointer;
            background-color: #f0f0f0;
            border: 1px solid #767676;
            border-radius: 2px;
        }

        /* Блок мессенджеров */
        .messenger-box {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px dashed #ccc;
        }

        .m-btn {
            display: inline-block;
            margin: 5px;
            padding: 10px 18px;
            text-decoration: none;
            color: white;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
        }

        .wa { background-color: #25D366; }
        .tg { background-color: #0088cc; }

        button:disabled { opacity: 0.5; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Написать нам</h2>

        <form id="commentForm">
            <input type="text" name="name" id="userName" placeholder="Ваше имя" required>
            
            <input type="text" name="contact" placeholder="Ваш телефон, WhatsApp или Telegram" required>
            
            <select name="subject" required>
                <option value="" disabled selected>Выберите тему обращения</option>
                <option value="Заказ">📦 Сделать заказ</option>
                <option value="Вопрос">❓ Вопрос по товару</option>
                <option value="Ошибка">⚠️ Ошибка в программе</option>
                <option value="Другое">📝 Другое</option>
            </select>
            
            <textarea name="message" id="commentText" placeholder="Введите ваше сообщение..." required></textarea>

            <div class="buttons">
                <button type="submit" id="submitBtn">Отправить</button>
                <button type="button" onclick="window.close()">Выход</button>
            </div>
        </form>

        <div class="messenger-box">
            <p style="font-size: 14px; color: #666; margin-bottom: 10px;">Быстрая связь без почты:</p>
            <a href="https://wa.me/79000000000" target="_blank" class="m-btn wa">WhatsApp</a>
            <a href="https://t.me/Alex_2858r" target="_blank" class="m-btn tg">Telegram</a>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const savedName = localStorage.getItem('username');
            if (savedName) document.getElementById('userName').value = savedName;
        });

        const form = document.getElementById('commentForm');
        const submitBtn = document.getElementById('submitBtn');

        form.onsubmit = async function(e) {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerText = "Отправка...";

            const formData = new FormData(form);

            try {
                const response = await fetch("https://formspree.io/f/xnjzerwn", {
                    method: "POST",
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    alert("Сообщение успешно отправлено!");
                    window.close(); 
                } else {
                    alert("Ошибка. Попробуйте написать в мессенджеры.");
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Отправить";
                }
            } catch (error) {
                alert("Нет связи с сервером.");
                submitBtn.disabled = false;
                submitBtn.innerText = "Отправить";
            }
        };
    </script>
</body>
</html>
