<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оставить комментарий</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 100px;
            margin-top: 10px;
            box-sizing: border-box; /* Чтобы textarea не вылезала за края */
        }
        .buttons {
            margin-top: 10px;
        }
        button, input[type="submit"] {
            margin: 5px;
            padding: 10px;
            cursor: pointer;
        }
        input[type="submit"] {
            background-color: #f0f0f0;
            border: 1px solid #767676;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <h2>Добавить комментарий</h2>

    <form action="https://formspree.io/f/xnjzerwn" method="POST" id="commentForm">
        
        <textarea id="commentText" name="message" placeholder="Введите ваш комментарий..." required></textarea>
        
        <input type="hidden" name="_next" value="https://infokom285.github.io/vostok/index.html">

        <div class="buttons">
            <button type="submit">Отправить</button>
            <button type="button" onclick="window.close()">Выход</button>
        </div>
    </form>

    <script>
        // Небольшой скрипт, чтобы предупредить об пустом поле
        document.getElementById('commentForm').onsubmit = function(e) {
            const comment = document.getElementById('commentText').value.trim();
            if (!comment) {
                e.preventDefault(); // Отменяем отправку
                alert("Комментарий не может быть пустым!");
            }
        };
    </script>
</body>
</html>
